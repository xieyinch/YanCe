name: Android debug build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk yance-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yance-debug
          path: yance-debug.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: debug-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "言策 Debug #${{ github.run_number }}" \
            --notes "自动构建的言策 Android 调试版 APK。提交：${{ github.sha }}" \
            --prerelease
          gh release upload "$RELEASE_TAG" yance-debug.apk \
            --repo "${{ github.repository }}" \
            --clobber
      - name: Remove older debug releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: debug-${{ github.run_number }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' |
            while IFS= read -r tag; do
              case "$tag" in
                debug-*)
                  if [ "$tag" != "$RELEASE_TAG" ]; then
                    gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes
                  fi
                  ;;
              esac
            done
